<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Dinámica desde CSV</title>

    <style>
        table{
            width:50%;
            border-collapse:collapse;
            margin:20px 0;
        }

        th, td{
            border:1px solid #ccc;
            padding:8px;
            text-align:left;
        }

        th{
            background-color:#f4f4f4;
        }
    </style>
</head>
<body>

    <h1>Tabla de usuarios v1</h1>

    <table id="tablaUsuarios">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody>
        </tbody>
    </table>

    <script src="listas.js"></script>

</body>
</html>
